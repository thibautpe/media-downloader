name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint_and_package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Create extension zip
        run: |
          mkdir -p release
          # Create a zip of tracked files to avoid packaging dev files
          git archive -o release/media-downloader.zip HEAD

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: media-downloader
          path: release/media-downloader.zip
