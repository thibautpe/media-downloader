name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint_and_package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Create final extension zip
        run: |
          mkdir -p dist
          rsync -a \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='release' \
            . dist/
          cd dist
          zip -r ../media-downloader.zip .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          files: media-downloader.zip
